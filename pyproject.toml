[project]
name = "mortgage-risk"
version = "0.1.0"
description = "Credit risk pipeline on Freddie Mac loan-level mortgage data"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

# Column order of the pipe-delimited Freddie Mac SFLLD files (no header row).
# Source: "Single-Family Loan-Level Dataset File Layout" on freddiemac.com.
# Freddie Mac revised the layout in July 2026. Check this list against the current
# File Layout document before the first run; ingest fails loudly if the column count differs.

origination:
  - credit_score
  - first_payment_date
  - first_time_homebuyer_flag
  - maturity_date
  - msa
  - mi_pct
  - number_of_units
  - occupancy_status
  - orig_cltv
  - orig_dti
  - orig_upb
  - orig_ltv
  - orig_interest_rate
  - channel
  - ppm_flag
  - amortization_type
  - property_state
  - property_type
  - postal_code
  - loan_sequence_number
  - loan_purpose
  - orig_loan_term
  - number_of_borrowers
  - seller_name
  - servicer_name
  - super_conforming_flag
  - pre_relief_refi_loan_sequence_number
  - special_eligibility_program
  - relief_refinance_indicator
  - property_valuation_method
  - interest_only_indicator
  - mi_cancellation_indicator

performance:
  - loan_sequence_number
  - monthly_reporting_period
  - current_actual_upb
  - current_loan_delinquency_status
  - loan_age
  - remaining_months_to_legal_maturity
  - defect_settlement_date
  - modification_flag
  - zero_balance_code
  - zero_balance_effective_date
  - current_interest_rate
  - current_non_interest_bearing_upb
  - due_date_of_last_paid_installment
  - mi_recoveries
  - net_sale_proceeds
  - non_mi_recoveries
  - total_expenses
  - legal_costs
  - maintenance_and_preservation_costs
  - taxes_and_insurance
  - miscellaneous_expenses
  - actual_loss_calculation
  - cumulative_modification_cost
  - step_modification_flag
  - payment_deferral
  - estimated_ltv
  - zero_balance_removal_upb
  - delinquent_accrued_interest
  - delinquency_due_to_disaster
  - borrower_assistance_status_code
  - current_month_modification_cost
  - interest_bearing_upb
